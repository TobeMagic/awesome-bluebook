<svg viewBox="0 0 680 252" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 26：patch 交出的是整块 config，不是差量</title>
<desc>左右对照。左框是「想改的字段」，中框是「差量」并画了删除线，右框是「整块 config，其余字段照抄」。系统不收差量：patch 必须写全，想保留的字段要自己重述一遍。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
  <marker id="art" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker>
</defs>
<rect x="40" y="40" width="160" height="140" rx="6" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="52" y="62" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">想改的字段</text>
<text x="52" y="88" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">persona: 简洁</text>
<text x="52" y="110" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hmr: false</text>
<text x="52" y="140" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">只写这两处</text>
<path d="M206,110 L234,110" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="240" y="40" width="160" height="140" rx="6" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="252" y="62" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">差量</text>
<text x="252" y="88" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">persona: 简洁</text>
<text x="252" y="110" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hmr: false</text>
<path d="M250,88 L318,88" fill="none" stroke="#5F5E5A" stroke-width="1.0"/>
<path d="M250,110 L318,110" fill="none" stroke="#5F5E5A" stroke-width="1.0"/>
<text x="252" y="140" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">系统不收</text>
<path d="M406,110 L434,110" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="440" y="40" width="220" height="140" rx="6" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="452" y="62" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">整块 config</text>
<text x="452" y="84" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">persona: 简洁</text>
<text x="452" y="106" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hmr: false</text>
<text x="452" y="128" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tools: { … }</text>
<text x="452" y="150" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"># 其余字段照抄</text>
<rect x="40" y="196" width="620" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="211.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">系统不收差量：patch 交出的是整块 config，想保留的字段要重述一遍。</text>
<text x="40" y="238" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">官方已知限制：覆盖替换整个设置块，不自动合并 · 该包自己的说明</text>
</svg>
