<svg viewBox="0 0 680 368" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 9：DeepSeek Harness 的六层结构</title>
<desc>从上到下六层：装配层 14 包 3%、宿主层 87 包 40%、内核层 57 包 19%、能力层 74 包 18%、边界层 14 包 3%、支撑层 70 包 17%。左侧箭头表示上层决定下层装配什么。最上层最小，越往下越大。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
</defs>
<rect x="40" y="22" width="608" height="46" rx="6" fill="#FBFAF7" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="48" y="33" width="48" height="24" rx="12" fill="#1B3A6B"/>
<text x="72" y="45" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">第1层</text>
<text x="112" y="45" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">装配层</text>
<text x="240" y="45" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">写排班表的：定这次装什么</text>
<rect x="40" y="74" width="608" height="46" rx="6" fill="#FBFAF7" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="48" y="85" width="48" height="24" rx="12" fill="#1B3A6B"/>
<text x="72" y="97" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">第2层</text>
<text x="112" y="97" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">宿主层</text>
<text x="240" y="97" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">门房：人在哪儿用，接待传话</text>
<rect x="40" y="126" width="608" height="46" rx="6" fill="#FBFAF7" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="48" y="137" width="48" height="24" rx="12" fill="#1B3A6B"/>
<text x="72" y="149" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">第3层</text>
<text x="112" y="149" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">内核层</text>
<text x="240" y="149" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">班组：一次任务绕不开的几件</text>
<rect x="40" y="178" width="608" height="46" rx="6" fill="#FBFAF7" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="48" y="189" width="48" height="24" rx="12" fill="#1B3A6B"/>
<text x="72" y="201" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">第4层</text>
<text x="112" y="201" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">能力层</text>
<text x="240" y="201" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">临时工：真正动手干活</text>
<rect x="40" y="230" width="608" height="46" rx="6" fill="#FBFAF7" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="48" y="241" width="48" height="24" rx="12" fill="#1B3A6B"/>
<text x="72" y="253" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">第5层</text>
<text x="112" y="253" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">边界层</text>
<text x="240" y="253" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">踩刹车的地方：哪些事不能做</text>
<rect x="40" y="282" width="608" height="46" rx="6" fill="#FBFAF7" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="48" y="293" width="48" height="24" rx="12" fill="#1B3A6B"/>
<text x="72" y="305" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">第6层</text>
<text x="112" y="305" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">支撑层</text>
<text x="240" y="305" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">杂物间：试验田与基建</text>
<path d="M28,33 V311" fill="none" stroke="#1B3A6B" stroke-width="1.2" marker-end="url(#arb)"/>
<text x="14" y="175" font-size="11" fill="#5F5E5A" text-anchor="middle" transform="rotate(-90 14 175)">越靠上的层越容易整体换掉</text>
<text x="40" y="352" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">箭头 = 覆盖方向，不是调用方向：越靠上的层定得越晚，换起来越省事 · 六层为本书归类，非官方</text>
</svg>
