<svg viewBox="0 0 680 294" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 25：三个角色各管一段，互不重叠</title>
<desc>三个并列方框。profile 是一份名单，列着组合包与树外插件；bundle 是一个 npm 包，装着配置项与挂载代码；patch 按 id 定位一行。下方箭头连成一段：决定装什么 → 给默认值 → 给最终值。三者管的事互不重叠。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
  <marker id="art" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker>
</defs>
<rect x="40" y="30" width="190" height="112" rx="6" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="135" y="54" font-size="13.5" font-weight="600" fill="#1B3A6B" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">profile</text>
<text x="135" y="74" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">一份名单</text>
<text x="56" y="98" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 组合包（按序叠放）</text>
<text x="56" y="118" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 树外插件</text>
<rect x="255" y="30" width="190" height="112" rx="6" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="350" y="54" font-size="13.5" font-weight="600" fill="#1B3A6B" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bundle</text>
<text x="350" y="74" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">一个 npm 包</text>
<text x="271" y="98" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 配置项</text>
<text x="271" y="118" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 挂载代码</text>
<rect x="470" y="30" width="190" height="112" rx="6" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="565" y="54" font-size="13.5" font-weight="600" fill="#1B3A6B" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">patch</text>
<text x="565" y="74" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">按 id 定位一行</text>
<text x="486" y="98" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 改已有行</text>
<text x="486" y="118" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">· 或 insert 新行</text>
<text x="135" y="196" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">决定装什么</text>
<path d="M178,196 L244,196" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="350" y="196" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">给默认值</text>
<path d="M393,196 L459,196" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="565" y="196" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">给最终值</text>
<rect x="40" y="228" width="620" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="243.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">三者不重叠：profile 定名单，bundle 供零件，patch 只改具体行。</text>
<text x="40" y="278" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">profile = $DSH_HOME/profiles/&lt;name&gt; · bundle = npm 包 · patch = cordis.patch.yml</text>
</svg>
