<svg viewBox="0 0 680 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 34：日志是唯一真源，消息历史是它的投影</title>
<desc>左侧一个窄的 SessionEvent 日志竖条，旁标「只写不改」；一支箭头由它指向右侧派生的「消息历史」框，框旁标「可删可重算」。核心反差：日志是唯一真源，消息历史只是它的投影——删掉这个视图不丢任何东西，回放就是从同一组事件重新派生。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
  <marker id="art" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker>
</defs>
<rect x="60" y="40" width="84" height="200" rx="8" fill="#1B3A6B"/>
<text x="102" y="140" font-size="12.5" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 102 140)">总账</text>
<path d="M144,71 L158,71" fill="none" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="160" y="58" width="90" height="26" rx="13" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="205" y="71" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">只写不改</text>
<path d="M146,140 L292,140" fill="none" stroke="#1B3A6B" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="150" y="124" font-size="10.5" font-weight="400" fill="#1B3A6B" text-anchor="start" dominant-baseline="central">照账誊抄</text>
<rect x="300" y="60" width="340" height="170" rx="10" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="320" y="88" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">抄件</text>
<text x="320" y="112" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">从总账誊抄，从不单独记账</text>
<rect x="320" y="136" width="108" height="26" rx="13" fill="#0F6E56"/>
<text x="374" y="149" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">可撕可重誊</text>
<text x="320" y="186" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">重誊 = 从同一本总账再抄一遍</text>
<text x="320" y="208" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">它是抄件，不是第二本账</text>
<rect x="40" y="246" width="608" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="261.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">只有一支笔写真账：事情记进总账；撕掉抄件，不丢任何东西。</text>
<text x="40" y="296" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">口径：总账只往后添、从不涂改，是唯一真源。</text>
<text x="40" y="314" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">抄件由总账誊抄而来，从不单独记账 · 简化自 官方会话子系统说明</text>
</svg>
