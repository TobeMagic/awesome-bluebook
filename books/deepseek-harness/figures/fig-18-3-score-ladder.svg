<svg viewBox="0 0 680 354" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 48：过关数与插件化的阶段</title>
<desc>横轴是过关数 0 到 5，每格 1 道检验；纵轴是五个阶段名，条形长度等于已过的道数。过 1 道只是单体加钩子，过 4 道状态能重建但信号不可信，过满 5 道才是热插拔成立。少一道，就少一层能力。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
  <marker id="art" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker>
</defs>
<path d="M328,250 L328,26" fill="none" stroke="#D8D6CD" stroke-width="1.0" stroke-dasharray="3 3"/>
<path d="M400,250 L400,26" fill="none" stroke="#D8D6CD" stroke-width="1.0" stroke-dasharray="3 3"/>
