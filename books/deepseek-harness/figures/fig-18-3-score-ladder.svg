<path d="M616,250 L616,26" fill="none" stroke="#D8D6CD" stroke-width="1.0" stroke-dasharray="3 3"/>
<path d="M256,22 L256,250" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
<path d="M256,250 L620,250" fill="none" stroke="#B4B2A9" stroke-width="1.0" marker-end="url(#ar)"/>
<path d="M256,250 L256,245" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="256" y="264" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0</text>
<path d="M328,250 L328,245" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="328" y="264" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1</text>
<path d="M400,250 L400,245" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="400" y="264" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2</text>
<path d="M472,250 L472,245" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="472" y="264" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3</text>
<path d="M544,250 L544,245" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="544" y="264" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4</text>
<path d="M616,250 L616,245" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="616" y="264" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">5</text>
<text x="620" y="236" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">过关数（每格 1 道检验）</text>
<text x="244" y="45.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">过 5 道 · 热插拔成立</text>
<rect x="256" y="30" width="360" height="30" rx="4" fill="#1B3A6B"/>
<text x="625" y="45.0" font-size="12" font-weight="600" fill="#1B3A6B" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">5</text>
<text x="244" y="89.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">过 4 道 · 状态能重建，信号不可信</text>
<rect x="256" y="74" width="288" height="30" rx="4" fill="#A9C4E4" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="553" y="89.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4</text>
<text x="244" y="133.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">过 3 道 · 能干净地卸，状态不唯一</text>
<rect x="256" y="118" width="216" height="30" rx="4" fill="#D3DFF0" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="481" y="133.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3</text>
<text x="244" y="177.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">过 2 道 · 能力能换，顺序还要人排</text>
<rect x="256" y="162" width="144" height="30" rx="4" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="409" y="177.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2</text>
<text x="244" y="221.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">过 1 道 · 单体加钩子</text>
<rect x="256" y="206" width="72" height="30" rx="4" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="337" y="221.0" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1</text>
<rect x="40" y="286" width="608" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="301.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">过满五道才叫热插拔；少一道，就少一层能力。</text>
<text x="40" y="340" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">五个阶段名与过关数取自 §18.7 的分层 · 五道检验为本书原创</text>
</svg>
