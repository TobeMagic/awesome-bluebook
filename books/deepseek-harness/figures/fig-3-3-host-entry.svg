<text x="99" y="152" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">黑窗口</text>
<path d="M158,152 C200,152 202,127 238,127" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="184" width="118" height="36" rx="6" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="99" y="202" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">别家程序</text>
<path d="M158,202 C200,202 202,127 238,127" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M420,127 H498" fill="none" stroke="#1B3A6B" stroke-width="1.6" marker-end="url(#arb)"/>
<text x="40" y="206" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">四种来法都从这一个窗口进 · 窗口能加，班组不必跟着长</text>
