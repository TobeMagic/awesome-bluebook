<svg viewBox="0 0 680 226" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 11：宿主层是所有客户端的入口</title>
<desc>浏览器、桌面 App、CLI、编辑器四种客户端都连到宿主层（client / api / host / sdk，87 个包，约 40% 代码），宿主层再接到内核层（session / llm / core / context）。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
</defs>
<rect x="240" y="88" width="180" height="80" rx="8" fill="#1B3A6B"/>
<text x="330" y="118" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">门房 · 宿主层</text>
<text x="330" y="142" font-size="11" font-weight="400" fill="#C9DBF1" text-anchor="middle" dominant-baseline="central">接待传话，不拿主意</text>
<rect x="500" y="88" width="140" height="80" rx="8" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="570" y="118" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">班组 · 内核层</text>
<text x="570" y="142" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">真正拿主意的地方</text>
<rect x="40" y="34" width="118" height="36" rx="6" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="99" y="52" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">网页</text>
<path d="M158,52 C200,52 202,127 238,127" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="84" width="118" height="36" rx="6" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="99" y="102" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">桌面</text>
