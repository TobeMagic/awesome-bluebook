<svg viewBox="0 0 680 298" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>三家外壳，三种卖法</title>
<desc>三家外壳的必做活相同，拉开差距的是选做活：成品房不许改格局，图纸铺把接口标清楚，插座房连管家都可替换。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
  <marker id="art" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker>
</defs>
<rect x="40" y="30" width="190" height="128" rx="10" fill="#FCFCFA" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="75" y="46" width="120" height="32" rx="8" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="135" y="62" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">卖成品房</text>
<text x="135" y="104" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">拎包入住，明天开工</text>
<text x="135" y="130" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">代价：格局改不了</text>
<rect x="245" y="30" width="190" height="128" rx="10" fill="#FCFCFA" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="280" y="46" width="120" height="32" rx="8" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="340" y="62" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">卖图纸</text>
<text x="340" y="104" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">管线的口标得清楚</text>
<text x="340" y="130" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">代价：自己得懂行</text>
<rect x="450" y="30" width="190" height="128" rx="10" fill="#FCFCFA" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="485" y="46" width="120" height="32" rx="8" fill="#F5F0E8" stroke="#A9C4E4" stroke-width="1.0"/>
<text x="545" y="62" font-size="13" font-weight="600" fill="#1B3A6B" text-anchor="middle" dominant-baseline="central">卖插座</text>
<text x="545" y="104" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">空房一排标准插座</text>
<text x="545" y="130" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">连管家都是插上去的</text>
<rect x="40" y="180" width="600" height="34" rx="8" fill="#EDF2F9" stroke="#A9C4E4" stroke-width="1.0"/>
<text x="340" y="197" font-size="12" font-weight="400" fill="#1B3A6B" text-anchor="middle" dominant-baseline="central">必做活三家都做：水电得通、门得能锁、干了活得有地方记账。</text>
<rect x="40" y="230" width="600" height="48" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="244.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">拉开差距的是选做活：房子留不留得动、师傅换不换得了、账本让不让拿回家。</text>
<text x="58" y="264.0" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">不是谁好谁坏，是三种卖法。</text>
</svg>
