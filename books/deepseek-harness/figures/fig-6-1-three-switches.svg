<circle cx="468" cy="164" r="6" fill="#0F6E56"/>
<circle cx="528" cy="164" r="6" fill="none" stroke="#B4B2A9" stroke-width="1.4"/>
<circle cx="588" cy="164" r="6" fill="none" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="312" y="194" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">serial</text>
<circle cx="468" cy="194" r="6" fill="#0F6E56"/>
<circle cx="528" cy="194" r="6" fill="#0F6E56"/>
<circle cx="588" cy="194" r="6" fill="#0F6E56"/>
<text x="636" y="194" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="end" dominant-baseline="central">全开</text>
<text x="312" y="224" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bail</text>
<circle cx="468" cy="224" r="6" fill="none" stroke="#B4B2A9" stroke-width="1.4"/>
<circle cx="528" cy="224" r="6" fill="#0F6E56"/>
<circle cx="588" cy="224" r="6" fill="#0F6E56"/>
<rect x="40" y="274" width="608" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="289.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">名字有五个，开关只有三组：emit 全关，serial 全开。</text>
<text x="40" y="322" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">对照官方五模式表；emit 59 个、waterfall 17、parallel 3、serial 2、bail 0</text>
