<text x="56" y="100" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">等待</text>
<rect x="120" y="89" width="66" height="22" rx="11" fill="#D8D6CD"/>
<circle cx="134" cy="100" r="9" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="200" y="100" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">等 / 不等</text>
<text x="56" y="152" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">顺序</text>
<rect x="120" y="141" width="66" height="22" rx="11" fill="#D8D6CD"/>
<circle cx="134" cy="152" r="9" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="200" y="152" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">按序 / 并发</text>
<text x="56" y="204" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">返回值</text>
<rect x="120" y="193" width="66" height="22" rx="11" fill="#D8D6CD"/>
<circle cx="134" cy="204" r="9" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="200" y="204" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">收 / 不收</text>
<rect x="300" y="36" width="348" height="224" rx="8" fill="#FBFAF7" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="312" y="62" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">模式</text>
<text x="468" y="62" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">等待</text>
<text x="528" y="62" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">顺序</text>
<text x="588" y="62" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">返回值</text>
<path d="M312,78 L636,78" fill="none" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="312" y="104" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">emit</text>
<circle cx="468" cy="104" r="6" fill="none" stroke="#B4B2A9" stroke-width="1.4"/>
<circle cx="528" cy="104" r="6" fill="none" stroke="#B4B2A9" stroke-width="1.4"/>
<circle cx="588" cy="104" r="6" fill="none" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="636" y="104" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="end" dominant-baseline="central">全关</text>
<text x="312" y="134" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">waterfall</text>
