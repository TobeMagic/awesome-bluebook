<svg viewBox="0 0 680 298" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 44：信号产生的路径与生产路径不是同一条</title>
<desc>上一条是测试路径：直接构造插件、手动提供 inject，信号为通过。下一条是生产路径：Loader 加载导出、真实解析服务，结果是崩溃。信号测的是上面这条路，所以它不能证明下面这条也对。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
  <marker id="art" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker>
</defs>
<rect x="40" y="30" width="608" height="64" rx="8" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="50" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">测试路径</text>
<text x="58" y="72" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">直接构造插件 → 手动提供 inject → 绿信号</text>
<rect x="560" y="42" width="74" height="26" rx="13" fill="#0F6E56"/>
<text x="597" y="55" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">通过</text>
<rect x="40" y="150" width="608" height="64" rx="8" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="58" y="170" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">生产路径</text>
<text x="58" y="192" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Loader 加载导出 → 真实解析服务 → 崩溃</text>
<rect x="560" y="162" width="74" height="26" rx="13" fill="#5F5E5A"/>
<text x="597" y="175" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">失败</text>
<path d="M420,96 V148" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="432" y="122" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">信号测的是上面这条路</text>
<rect x="40" y="236" width="608" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="251.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">检验：这个信号是在哪条路径上产生的？那条路径和生产路径是同一条吗？</text>
<text x="40" y="286" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">整理自 官方复盘 0001</text>
</svg>
