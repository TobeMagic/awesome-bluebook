<svg viewBox="0 0 680 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 15：消费方查 key，提供方供 key</title>
<desc>左边是消费方插件，右边是提供方插件，中间是 ctx.tools 这个固定的 key。两边各一条箭头指向中间，左标查 key、右标供 key，两条边都被中间截断，两边之间没有连线。下方画出 import 的写法作对比：两个包直接相连，换一个要动另一个。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
  <marker id="art" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker>
</defs>
<rect x="40" y="70" width="172" height="64" rx="8" fill="#EDF2F9" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="126" y="92" font-size="12.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">消费方插件</text>
<text x="126" y="112" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">只写字符串 tools</text>
<rect x="254" y="60" width="172" height="84" rx="8" fill="#1B3A6B"/>
<text x="340" y="88" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ctx.tools</text>
<text x="340" y="110" font-size="11" font-weight="400" fill="#C9DBF1" text-anchor="middle" dominant-baseline="central">一个固定的 key</text>
<rect x="468" y="70" width="172" height="64" rx="8" fill="#EDF2F9" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="554" y="92" font-size="12.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">提供方插件</text>
<text x="554" y="112" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">供 tools</text>
<path d="M216,102 H250" fill="none" stroke="#1B3A6B" stroke-width="1.4" marker-end="url(#arb)"/>
<path d="M468,102 H432" fill="none" stroke="#1B3A6B" stroke-width="1.4" marker-end="url(#arb)"/>
<text x="233" y="84" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">查 key</text>
<text x="451" y="84" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">供 key</text>
<text x="340" y="158" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">两条边都被中间截断；两边之间没有连线</text>
<rect x="40" y="178" width="608" height="76" rx="8" fill="#FBFAF7" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="56" y="200" font-size="11.5" font-weight="600" fill="#0F6E56" text-anchor="start" dominant-baseline="central">对比 import 的写法</text>
<text x="56" y="226" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">两个包直连，换一个要动另一个</text>
<rect x="300" y="190" width="96" height="40" rx="6" fill="#A9C4E4"/>
<text x="348" y="210" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">包 A</text>
<path d="M400,210 H440" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="420" y="198" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">直连</text>
<rect x="444" y="190" width="96" height="40" rx="6" fill="#A9C4E4"/>
<text x="492" y="210" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">包 B</text>
<rect x="40" y="268" width="608" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="283.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">消费方查 key，提供方供 key；两边互不认识，换提供方不动消费方。</text>
<text x="40" y="316" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">两条边都止于中间的 key 框，两边之间没有直连的边 · 对比 import 的写法</text>
</svg>
