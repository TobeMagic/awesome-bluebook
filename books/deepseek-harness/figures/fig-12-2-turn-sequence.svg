<svg viewBox="0 0 680 1072" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 29：从 followup 到工具结果，一次轮次的完整时序</title>
<desc>竖向时序图，七条生命线自左向右：用户/SDK、Session、Driver、hooks、ctx.systemPrompt、ctx.llm、ctx.tools，时间自上而下。followup 进来后 Driver 开轮次（turn/start），组装提示词、跑 agent/pre-step；被拒或首批为空则空轮次结束，接纳则开步骤（step/start），协调请求、llm/stream 流式返回，模型成功后进工具循环（tool/call → 有序 pre、并发 execute → tool/result），最后 step/end、turn/end、agent/status idle。左侧括号标出 alt / else / loop / opt 分支。</desc>
