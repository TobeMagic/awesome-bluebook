<title>图 37：四种角色看实现列</title>
<desc>四种角色并排：core 核心主干服务、seam 可替换的能力 seam、service 独立服务、bundle 组合包。core、service、bundle 三格的实现列都是空的，只能靠官方角色列区分；seam 那格有平级实现包。</desc>
