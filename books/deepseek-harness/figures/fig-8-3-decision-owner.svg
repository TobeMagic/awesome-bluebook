<svg viewBox="0 0 680 316" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 24：有决策的停链，做标注的必须往下传</title>
<desc>三分支判定。顶部一个菱形问有没有决策权。答有通向可以不调 next；答没有通向两条并列的必须调 next，分别标注策略型与标注型。核心反差：短路不是随意返回，而是一种有归属的权力。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
  <marker id="art" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker>
</defs>
<path d="M340,20.0 L470.0,56 L340,92.0 L210.0,56 Z" fill="#F5F0E8" stroke="#1B3A6B" stroke-width="1.2"/>
<text x="340" y="56" font-size="12.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">有没有决策权？</text>
<rect x="60" y="160" width="200" height="54" rx="8" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="160" y="180" font-size="12.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">可以不调 next</text>
<text x="160" y="200" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">（有决策）</text>
<path d="M212,58 C195,90 165,120 160,156" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="172" y="104" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">有</text>
<rect x="300" y="160" width="160" height="54" rx="8" fill="#D3DFF0"/>
<text x="380" y="180" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">必须调 next</text>
<text x="380" y="200" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">（策略型）</text>
<rect x="480" y="160" width="160" height="54" rx="8" fill="#D3DFF0"/>
<text x="560" y="180" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">必须调 next</text>
<text x="560" y="200" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">（标注型）</text>
<path d="M340,92 C340,110 380,110 380,156" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M340,92 C340,110 470,112 560,156" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="352" y="110" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">没有</text>
<rect x="40" y="240" width="608" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="255.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">短路不是随意返回，而是一种有归属的权力：有决策可以停链，做标注的必须往下传。</text>
<text x="40" y="302" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">只负责观察或标注的监听器必须调 next()；不调即有意短路 · 据 官方 Cordis 入门的 waterfall 语义一节</text>
</svg>
