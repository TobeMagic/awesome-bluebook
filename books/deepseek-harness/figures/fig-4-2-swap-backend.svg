<svg viewBox="0 0 680 402" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 16：换掉循环，只有装配清单要动</title>
<desc>上半是一个消费方，注入 shell，下面并排两个可互换的后端；换后端只改装配清单那一行。下半是装配清单指向 agent-loop，316 个包的依赖图里只有 3 条边指向 agent-loop，两条来自装配包。换后端与换循环，改动都落在装配清单这一格。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
  <marker id="art" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker>
</defs>
<text x="40" y="30" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">① 一个消费方，两个可换的实现</text>
<rect x="230" y="52" width="220" height="54" rx="8" fill="#1B3A6B"/>
<text x="340" y="74" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">消费方</text>
<text x="340" y="94" font-size="11" font-weight="400" fill="#C9DBF1" text-anchor="middle" dominant-baseline="central">只报一个名字，不认实现</text>
<rect x="96" y="150" width="200" height="50" rx="8" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="196" y="168" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">原来的实现</text>
<text x="196" y="186" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">眼下挂着的那一个</text>
<rect x="384" y="150" width="200" height="50" rx="8" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="484" y="168" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">顶替上来的实现</text>
<text x="484" y="186" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">挂上它即完成替换</text>
<path d="M340,106 C340,128 196,128 196,146" fill="none" stroke="#1B3A6B" stroke-width="1.4" marker-end="url(#arb)"/>
<path d="M340,106 C340,128 484,128 484,146" fill="none" stroke="#1B3A6B" stroke-width="1.4" marker-end="url(#arb)"/>
<text x="341" y="172" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">可互换</text>
<path d="M300,164 H322" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#art)"/>
<path d="M382,180 H360" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#art)"/>
<path d="M40,222 L648,222" fill="none" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="40" y="244" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">② 换更大的件，改的还是这一格</text>
<rect x="40" y="258" width="236" height="64" rx="8" fill="#EDF2F9" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="158" y="282" font-size="12.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">装配清单</text>
<text x="158" y="304" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">列清单，不实现循环</text>
<path d="M280,290 H356" fill="none" stroke="#1B3A6B" stroke-width="1.4" marker-end="url(#arb)"/>
<text x="318" y="276" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">改动落在这格</text>
<rect x="360" y="258" width="208" height="64" rx="8" fill="#0F6E56"/>
<text x="464" y="282" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">循环本体</text>
<text x="464" y="304" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">可替换</text>
<rect x="40" y="340" width="608" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="355.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">换后端与换循环，改动都落在装配清单那一格。</text>
<text x="40" y="388" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">消费方从头到尾没动过：它做的事，一直只是报出一个名字</text>
</svg>
