<svg viewBox="0 0 680 350" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 12：内核四件套的依赖关系</title>
<desc>agent 依赖 llm、tools 和 session；tools 也依赖 session。四个节点标注被依赖包数：session 101、llm 94、agent 76、tools 55。session 位于最底部，被所有组件依赖。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
</defs>
<text x="40" y="24" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">按代码量排</text>
<text x="360" y="24" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">按被依赖排</text>
<text x="40" y="58.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">门脸（界面）</text>
