<text x="360" y="218.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">门脸（界面）</text>
<rect x="470" y="208" width="14" height="20" rx="3" fill="#D8D6CD"/>
<text x="644" y="218.0" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">排不进前列</text>
<line x1="350" y1="40" x2="350" y2="232" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M344,58 C400,96 424,160 462,206" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="340" y="258" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">同一个「门脸」，换个排法就垫底</text>
<rect x="40" y="278" width="608" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="293" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">代码量不等于重要性：按工程量排门脸最大，按被依赖排流水账最靠前。</text>
<text x="40" y="330" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">条长只表相对多少，不标数字 · 被依赖 = 有多少东西离不开它</text>
