<text x="360" y="98.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">翻译官</text>
<rect x="470" y="88" width="150" height="20" rx="3" fill="#5DCAA5"/>
<text x="360" y="138.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">花名册</text>
<rect x="470" y="128" width="118" height="20" rx="3" fill="#5DCAA5"/>
<text x="360" y="178.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">工具箱</text>
