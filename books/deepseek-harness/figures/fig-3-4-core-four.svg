<text x="40" y="178.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">花名册</text>
<rect x="150" y="168" width="36" height="20" rx="3" fill="#85B7EB"/>
<text x="40" y="218.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">流水账</text>
