<svg viewBox="0 0 680 368" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图 23：委托与短路是两条路</title>
<desc>两条分叉路径。上路径是委托：监听器经 next() 走到内置行为，返回值再一层层往外穿。下路径是短路：监听器直接 return，右侧内置行为框变灰，下游监听器框变虚并被一段虚线括起来标记为被跳过。核心反差：调不调 next() 决定后面一大截代码跑不跑。</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#5F5E5A"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1B3A6B"/></marker>
  <marker id="art" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker>
</defs>
<text x="40" y="34" font-size="11.5" font-weight="600" fill="#0F6E56" text-anchor="start" dominant-baseline="central">① 委托：调 next()，请求穿到底，结果再回上来</text>
<rect x="40" y="52" width="140" height="48" rx="8" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="110" y="76" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">监听器 A</text>
<path d="M180,76 H256" fill="none" stroke="#1B3A6B" stroke-width="1.4" marker-end="url(#arb)"/>
<text x="218" y="62" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">next()</text>
<rect x="260" y="52" width="140" height="48" rx="8" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="330" y="76" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">下游监听器</text>
<path d="M400,76 H476" fill="none" stroke="#1B3A6B" stroke-width="1.4" marker-end="url(#arb)"/>
<text x="438" y="62" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">next()</text>
<rect x="480" y="52" width="150" height="48" rx="8" fill="#1B3A6B"/>
<text x="555" y="76" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">内置行为</text>
<path d="M480,104 C420,140 170,140 110,104" fill="none" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#art)"/>
<text x="300" y="150" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">返回值一层层往外穿</text>
<path d="M40,172 L648,172" fill="none" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="40" y="194" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">② 短路：不调 next()，直接 return</text>
<rect x="40" y="212" width="140" height="48" rx="8" fill="#EDF2F9" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="110" y="228" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">监听器 A</text>
<text x="110" y="245" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">直接 return</text>
<rect x="260" y="212" width="140" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="330" y="236" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">下游监听器</text>
<rect x="480" y="212" width="150" height="48" rx="8" fill="#D8D6CD"/>
<text x="555" y="236" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">内置行为</text>
<path d="M180,236 L256,236" fill="none" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M400,236 L476,236" fill="none" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M212,230 L224,242" fill="none" stroke="#5F5E5A" stroke-width="1.3"/>
<path d="M224,230 L212,242" fill="none" stroke="#5F5E5A" stroke-width="1.3"/>
<path d="M432,230 L444,242" fill="none" stroke="#5F5E5A" stroke-width="1.3"/>
<path d="M444,230 L432,242" fill="none" stroke="#5F5E5A" stroke-width="1.3"/>
<path d="M262,270 L626,270" fill="none" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M262,264 L262,270" fill="none" stroke="#B4B2A9" stroke-width="1.2"/>
<path d="M626,264 L626,270" fill="none" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="444" y="286" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">被跳过（短路）</text>
<rect x="40" y="306" width="608" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="321.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">调不调 next() 决定后面一大截代码跑不跑。</text>
<text x="40" y="354" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">不调 next() 直接返回即短路；下游监听器与内置行为一起被跳过 · 简化自 官方事件教程</text>
</svg>
