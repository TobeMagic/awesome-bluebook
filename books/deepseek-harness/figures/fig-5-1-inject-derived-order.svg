<title>图 17：顺序由声明推出来</title>
<desc>左边一列是配置文件里的书写顺序，右边一列是实际加载顺序，两列序号对不上。右边那列由 inject 的边推出来，提供方排在消费方前面。核心反差：写文件的顺序不算数，声明才算数。</desc>
