<rect x="73" y="96" width="38" height="34" rx="6" fill="none" stroke="#D8D6CD" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="92" y="113" font-size="11" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">—</text>
<rect x="589" y="96" width="38" height="34" rx="6" fill="none" stroke="#D8D6CD" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="608" y="113" font-size="11" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">—</text>
<text x="92" y="156" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">先记账，不拦人</text>
<text x="221" y="148" font-size="11" font-weight="600" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">能拒</text>
<text x="221" y="164" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">只拦不放，能喊停</text>
<text x="350" y="148" font-size="11" font-weight="600" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">能不放</text>
<text x="350" y="164" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">把门的点头才过，能喊停</text>
<text x="479" y="148" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">递家伙的喊不停</text>
<text x="479" y="164" font-size="10.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">调得动闹钟，停不下这颗</text>
<text x="608" y="156" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">定稿与观察</text>
<rect x="40" y="186" width="608" height="40" rx="8" fill="#FBFAF7" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="56" y="190" width="4" height="16" rx="2" fill="#0F6E56"/>
<rect x="62" y="190" width="4" height="16" rx="2" fill="#0F6E56"/>
<rect x="68" y="190" width="4" height="16" rx="2" fill="#0F6E56"/>
<rect x="74" y="190" width="4" height="16" rx="2" fill="#0F6E56"/>
<rect x="54" y="202" width="26" height="22" rx="6" fill="#0F6E56"/>
<rect x="48" y="206" width="8" height="12" rx="4" fill="#0F6E56"/>
<text x="104" y="206" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">把门的——审查拿不准时报他；他不点头，这颗就拦下，能喊停</text>
<rect x="40" y="232" width="608" height="40" rx="8" fill="#FBFAF7" stroke="#D8D6CD" stroke-width="1.0"/>
<rect x="56" y="236" width="4" height="16" rx="2" fill="#0F6E56"/>
<rect x="62" y="236" width="4" height="16" rx="2" fill="#0F6E56"/>
<rect x="68" y="236" width="4" height="16" rx="2" fill="#0F6E56"/>
<rect x="74" y="236" width="4" height="16" rx="2" fill="#0F6E56"/>
<rect x="54" y="248" width="26" height="22" rx="6" fill="#0F6E56"/>
<rect x="48" y="252" width="8" height="12" rx="4" fill="#0F6E56"/>
<text x="104" y="252" font-size="11" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">外头下活的——随时收回这颗，能喊停；换个闹钟也切不断收回</text>
<rect x="40" y="288" width="608" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="303.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">叫停不是无声的：先记账，后动手；拦下的、拧砸的、收回的，都归成同一张回话。</text>
<text x="40" y="340" font-size="10.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">链上只有递家伙的那只手喊不停 · 简化自 官方工具流水线文档</text>
</svg>
