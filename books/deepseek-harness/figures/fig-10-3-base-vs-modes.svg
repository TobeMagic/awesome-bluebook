<text x="654" y="88" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="end" dominant-baseline="central">底板的高度</text>
<text x="390" y="338" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">各编制自己的薄清单</text>
<rect x="40" y="356" width="620" height="30" rx="6" fill="#F5F0E8" stroke="#D8D6CD" stroke-width="1.0"/>
<text x="58" y="371.0" font-size="11.5" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">共享底板比最重的那份编制还薄：会不一样的行，都被推到各编制自己的纸上。</text>
<text x="40" y="398" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">条高只表厚薄，不标数字 · 虚线框那份不踩底板，自己从头到尾写全</text>
