<text x="195.0" y="318" font-size="11" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">满编</text>
<rect x="280" y="231.42857142857144" width="50" height="68.57142857142857" rx="6" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="305.0" y="318" font-size="11" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">不合群</text>
